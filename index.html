<!DOCTYPE html>
<!-- ============================================================
     index.html — AHTH Graph Generator
     แสดงกราฟอุณหภูมิจากไฟล์ log ของตู้เย็น (อ่านไฟล์ใน browser เท่านั้น)
     ข้อความทุกจุดที่มี data-th / data-en จะสลับภาษาได้
     ============================================================ -->
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AHTH Graph Generator</title>
  <meta name="description" content="แสดงกราฟอุณหภูมิจากไฟล์ log ของตู้เย็น / Temperature graphs from refrigerator log files">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="container topbar-inner">
      <a href="./" class="logo">AHTH Graph Generator <span class="version">Release version <span id="app-version"></span></span></a>
      <button id="lang-btn" class="lang-btn" type="button" aria-label="Switch language">EN</button>
    </div>
  </header>

  <main class="container">

    <!-- ===== เลือกไฟล์ ===== -->
    <section class="panel" id="load-panel">
      <label id="dropzone" class="dropzone" for="file-input">
        <input id="file-input" type="file" accept=".log,.txt,.csv,.xlsx" hidden>
        <span class="dz-icon" aria-hidden="true">📈</span>
        <strong data-th="ลากไฟล์ .log / .csv / .xlsx มาวางที่นี่ หรือคลิกเพื่อเลือกไฟล์"
                data-en="Drop a .log / .csv / .xlsx file here, or click to choose one">ลากไฟล์ .log / .csv / .xlsx มาวางที่นี่ หรือคลิกเพื่อเลือกไฟล์</strong>
        <span class="muted"
              data-th="ไฟล์ถูกอ่านในเครื่องของคุณเท่านั้น ไม่ถูกส่งขึ้นอินเทอร์เน็ต"
              data-en="The file is read on your device only. Nothing is uploaded.">ไฟล์ถูกอ่านในเครื่องของคุณเท่านั้น ไม่ถูกส่งขึ้นอินเทอร์เน็ต</span>
      </label>
      <p class="sample-line">
        <button id="sample-btn" class="link-btn" type="button"
                data-th="ลองด้วยไฟล์ตัวอย่าง" data-en="Try the sample file">ลองด้วยไฟล์ตัวอย่าง</button>
      </p>

      <div id="progress" class="progress" hidden>
        <progress id="progress-bar" max="100" value="0"></progress>
        <span id="progress-text"></span>
      </div>

      <div id="message" class="message" role="status" hidden></div>
    </section>

    <!-- ===== ผลลัพธ์ ===== -->
    <section id="result" hidden>

      <div class="panel">
        <dl id="file-info" class="file-info"></dl>
      </div>

      <div class="panel">
        <div class="range-controls">
          <label>
            <span data-th="เริ่ม" data-en="From">เริ่ม</span>
            <input id="range-start" type="datetime-local" step="1">
          </label>
          <label>
            <span data-th="สิ้นสุด" data-en="To">สิ้นสุด</span>
            <input id="range-end" type="datetime-local" step="1">
          </label>
          <div class="range-buttons">
            <button id="range-apply" class="btn" type="button" data-th="แสดงช่วงนี้" data-en="Apply">แสดงช่วงนี้</button>
            <button id="zoom-reset" class="btn secondary" type="button" data-th="ดูทั้งหมด" data-en="Reset zoom">ดูทั้งหมด</button>
          </div>
        </div>
        <ul class="hint muted">
          <li data-th="ลูกกลิ้งเมาส์ = ซูมเข้า/ออก" data-en="Mouse wheel = zoom in/out">ลูกกลิ้งเมาส์ = ซูมเข้า/ออก</li>
          <li data-th="ลากคลิกขวา = ซูมเข้าช่วงที่ลาก" data-en="Right-drag = zoom to range">ลากคลิกขวา = ซูมเข้าช่วงที่ลาก</li>
          <li data-th="ลากคลิกซ้าย = เลือกช่วงเพื่อดูค่า · คลิกซ้ายเพื่อยกเลิก" data-en="Left-drag = select a range to inspect · left-click to clear">ลากคลิกซ้าย = เลือกช่วงเพื่อดูค่า · คลิกซ้ายเพื่อยกเลิก</li>
          <li data-th="ดับเบิลคลิก = ดูทั้งหมด" data-en="Double-click = reset zoom">ดับเบิลคลิก = ดูทั้งหมด</li>
        </ul>

        <div id="chart" class="chart"></div>
      </div>

      <div class="panel">
        <p class="cursor-time"><span data-th="เวลาที่เคอร์เซอร์:" data-en="Cursor time:">เวลาที่เคอร์เซอร์:</span>
          <strong id="cursor-time">–</strong>
          <span class="cursor-sep">·</span>
          <span data-th="ซอฟต์แวร์:" data-en="Software:">ซอฟต์แวร์:</span>
          <strong id="cursor-software">–</strong></p>
        <div class="table-wrap">
          <table class="stats">
            <thead>
              <tr>
                <th data-th="ชื่อ" data-en="Name">ชื่อ</th>
                <th class="num" data-th="ค่า ณ เคอร์เซอร์" data-en="At cursor">ค่า ณ เคอร์เซอร์</th>
                <th class="num">Min</th>
                <th class="num">Max</th>
                <th class="num" data-th="เฉลี่ย" data-en="Average">เฉลี่ย</th>
              </tr>
            </thead>
            <tbody id="stats-body"></tbody>
          </table>
        </div>
        <p id="stats-scope" class="stats-scope">
          <span id="stats-scope-text"></span>
          <button id="clear-selection" class="link-btn" type="button" hidden
                  data-th="ยกเลิกการเลือก" data-en="Clear selection">ยกเลิกการเลือก</button>
        </p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© <span id="year"></span> <span id="now"></span></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.iife.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
